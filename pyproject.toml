[project]
name = "jwalt-ai-agent"
version = "0.1.0"
description = "Autonomous business-development agent for J-WALT (Dubai interior fit-out company)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "apollo_integration: hits the real Apollo API and consumes credits; skipped unless RUN_APOLLO_INTEGRATION_TESTS=1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
